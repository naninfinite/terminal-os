<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile zoom policy (Option B):
      - disable page-level pinch zoom so shell framing remains stable.
      - allow pinch scaling only inside active panel content.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>TERMINAL-OS</title>
    <style>
      :root {
        --landing-bg: #000000;
        --landing-text: #00ff66;
        --landing-text-muted: #66ffcc;
        --landing-border: #00ff66;
        --landing-shadow: 0 0 0 1px rgba(0, 255, 102, 0.18) inset;
        --landing-grid-rgb: 0 255 102;
        --landing-status-bg: rgba(0, 0, 0, 0.56);
      }

      :root[data-theme='light'] {
        --landing-bg: #f5f4ef;
        --landing-text: #15563f;
        --landing-text-muted: #4f6d61;
        --landing-border: #0f8f63;
        --landing-shadow: 0 0 0 1px rgba(15, 143, 99, 0.18) inset;
        --landing-grid-rgb: 15 143 99;
        --landing-status-bg: rgba(245, 244, 239, 0.8);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--landing-bg);
      }

      body {
        position: relative;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #landing-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--landing-bg);
        color: var(--landing-text);
        font-family: 'IBM Plex Mono', 'Iosevka Term', 'Courier New', monospace;
        font-size: 14px;
        letter-spacing: 0.05em;
        text-transform: var(--ui-text-transform, uppercase);
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #landing-shell[data-state='hidden'] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #landing-shell::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to right, rgb(var(--landing-grid-rgb) / 0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(var(--landing-grid-rgb) / 0.08) 1px, transparent 1px);
        background-size: 28px 28px;
        opacity: 0.18;
        pointer-events: none;
      }

      #landing-shell-center {
        position: relative;
        width: min(92vw, 960px);
        max-width: 100%;
        display: grid;
        place-items: center;
        padding: 0 12px;
        box-sizing: border-box;
      }

      #landing-shell-frame {
        width: 100%;
        max-width: 100%;
        min-height: 360px;
        border: 2px solid var(--landing-border);
        box-shadow: var(--landing-shadow);
        padding: 8px;
        background: var(--landing-bg);
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }

      #landing-shell-header {
        width: 100%;
        border-bottom: 1px solid var(--landing-border);
        padding-bottom: 4px;
        margin-bottom: 6px;
        font-size: 12px;
      }

      #landing-shell-body {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
      }

      #landing-shell-scene {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 2px solid var(--landing-border);
        background:
          radial-gradient(circle at 50% 28%, rgb(var(--landing-grid-rgb) / 0.14), transparent 34%),
          linear-gradient(
            180deg,
            rgb(var(--landing-grid-rgb) / 0.06),
            transparent 30%,
            rgb(var(--landing-grid-rgb) / 0.03)
          ),
          var(--landing-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      #landing-shell-scene[data-loading='true'] #landing-shell-sweep {
        animation-duration: 1.3s;
        opacity: 0.94;
      }

      #landing-shell-field {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #landing-shell-glow {
        position: absolute;
        inset: 16% 18%;
        background: radial-gradient(circle, rgb(var(--landing-grid-rgb) / 0.26), transparent 64%);
        filter: blur(18px);
        opacity: 0.75;
      }

      #landing-shell-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgb(var(--landing-grid-rgb) / 0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(var(--landing-grid-rgb) / 0.08) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: linear-gradient(180deg, transparent, #000 22%, #000 82%, transparent);
        opacity: 0.78;
      }

      #landing-shell-sweep {
        position: absolute;
        inset: -30% 0;
        background: linear-gradient(180deg, transparent 36%, rgb(var(--landing-grid-rgb) / 0.18) 50%, transparent 64%);
        animation: landing-shell-sweep 2.8s linear infinite;
        opacity: 0.72;
      }

      #landing-shell-telemetry {
        position: absolute;
        top: 16px;
        left: 16px;
        display: grid;
        gap: 7px;
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--landing-text);
        text-shadow: 0 0 8px rgb(var(--landing-grid-rgb) / 0.38);
      }

      #landing-shell-status {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 54px;
        z-index: 1;
        margin: 0;
        padding: 4px 10px;
        border: 1px solid var(--landing-border);
        background: var(--landing-status-bg);
        color: var(--landing-text-muted);
        box-sizing: border-box;
        line-height: 1;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.08em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #landing-shell-enter {
        appearance: none;
        -webkit-appearance: none;
        position: absolute;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 1;
        border: 2px solid var(--landing-border);
        background: transparent;
        color: var(--landing-text);
        padding: 6px 12px;
        font-family: inherit;
        font-size: 12px;
        letter-spacing: inherit;
        line-height: 1;
        cursor: pointer;
        box-sizing: border-box;
        white-space: nowrap;
      }

      #landing-shell-enter:focus-visible {
        outline: 1px dashed var(--landing-border);
        outline-offset: 2px;
      }

      @keyframes landing-shell-sweep {
        from {
          transform: translateY(-48%);
        }

        to {
          transform: translateY(48%);
        }
      }

      @media (max-width: 520px) {
        #landing-shell-center {
          width: 100%;
          min-height: 100vh;
          min-height: 100dvh;
          place-items: stretch;
          padding: 0;
        }

        #landing-shell-frame {
          min-height: 100vh;
          min-height: 100dvh;
          padding:
            calc(8px + env(safe-area-inset-top, 0px))
            calc(8px + env(safe-area-inset-right, 0px))
            calc(8px + env(safe-area-inset-bottom, 0px))
            calc(8px + env(safe-area-inset-left, 0px));
        }

        #landing-shell-scene {
          height: 100%;
          min-height: 0;
          aspect-ratio: auto;
        }

        #landing-shell-telemetry {
          top: 12px;
          left: 12px;
          gap: 5px;
          font-size: 9px;
        }

        #landing-shell-status {
          left: 10px;
          right: 10px;
          bottom: 50px;
          padding: 4px 8px;
          font-size: 9px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #landing-shell {
          transition: none;
        }

        #landing-shell-enter {
          transition: none;
        }

        #landing-shell-sweep {
          animation: none;
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <div id="landing-shell" data-state="visible">
      <div id="landing-shell-center">
        <section id="landing-shell-frame" aria-label="ENTER.EXE" aria-busy="false">
          <header id="landing-shell-header">[ENTER.EXE]</header>
          <div id="landing-shell-body">
            <div id="landing-shell-scene" data-loading="false">
              <div id="landing-shell-field" aria-hidden="true">
                <div id="landing-shell-glow"></div>
                <div id="landing-shell-grid"></div>
                <div id="landing-shell-sweep"></div>
                <div id="landing-shell-telemetry">
                  <span>BOOT SECTOR 01</span>
                  <span>DISPLAY BUS ONLINE</span>
                  <span>STANDBY</span>
                </div>
              </div>
              <p id="landing-shell-status" role="status" aria-live="polite" aria-atomic="true">
                PRESS ENTER TO LOAD DESKTOP.
              </p>
              <button
                id="landing-shell-enter"
                type="button"
                aria-label="Enter Terminal-OS"
                aria-busy="false"
              >
                ENTER
              </button>
            </div>
          </div>
        </section>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var THEME_STORAGE_KEY = 'terminalOS.ui.v1.theme';
        var TEXT_CASE_STORAGE_KEY = 'terminalOS.ui.v1.textCase';
        var LEGACY_LOCATION_CASE_STORAGE_KEY = 'terminalOS.ui.v1.locationCase';
        var DEFAULT_STATUS = 'PRESS ENTER TO LOAD DESKTOP.';
        var WARNING_STATUS = 'STILL INITIALIZING INTERFACE...';
        var PENDING_STATUS = 'LOADING DESKTOP...';
        var FAILED_STATUS = 'INTERFACE STALLED. PRESS RELOAD TO RETRY.';
        var reduceMotion = typeof window.matchMedia === 'function'
          && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var root = document.documentElement;
        var shell = document.getElementById('landing-shell');
        var statusNode = document.getElementById('landing-shell-status');
        var enterButton = document.getElementById('landing-shell-enter');
        var scene = document.getElementById('landing-shell-scene');
        var shellFrame = document.getElementById('landing-shell-frame');
        var enterRequested = false;
        var interactive = false;
        var failed = false;
        var warningTimeoutId = 0;
        var failureTimeoutId = 0;
        var errorListener = null;
        var rejectionListener = null;
        var keyListener = null;

        var readStoredValue = function (key, fallbackValue) {
          try {
            var raw = window.localStorage.getItem(key);
            if (raw == null) return fallbackValue;
            return JSON.parse(raw);
          } catch (error) {
            return fallbackValue;
          }
        };

        var setStatus = function (message) {
          if (statusNode) {
            statusNode.textContent = message;
          }
        };

        var setSceneLoading = function (isLoading) {
          if (scene) {
            scene.setAttribute('data-loading', isLoading ? 'true' : 'false');
          }
          if (shellFrame) {
            shellFrame.setAttribute('aria-busy', isLoading ? 'true' : 'false');
          }
          if (enterButton) {
            enterButton.setAttribute('aria-busy', isLoading ? 'true' : 'false');
          }
        };

        var setButtonMode = function (mode) {
          if (!enterButton) return;

          if (mode === 'reload') {
            enterButton.textContent = 'RELOAD';
            enterButton.setAttribute('aria-label', 'Reload Terminal-OS');
            return;
          }

          if (mode === 'loading') {
            enterButton.textContent = 'LOADING...';
            enterButton.setAttribute('aria-label', 'Initializing Terminal-OS');
            return;
          }

          enterButton.textContent = 'ENTER';
          enterButton.setAttribute('aria-label', 'Enter Terminal-OS');
        };

        var cleanupLandingWatchdog = function () {
          if (warningTimeoutId) {
            window.clearTimeout(warningTimeoutId);
            warningTimeoutId = 0;
          }
          if (failureTimeoutId) {
            window.clearTimeout(failureTimeoutId);
            failureTimeoutId = 0;
          }
          if (errorListener) {
            window.removeEventListener('error', errorListener);
            errorListener = null;
          }
          if (rejectionListener) {
            window.removeEventListener('unhandledrejection', rejectionListener);
            rejectionListener = null;
          }
          if (keyListener) {
            window.removeEventListener('keydown', keyListener);
            keyListener = null;
          }
        };

        var normalizeLandingErrorMessage = function (value) {
          if (typeof value === 'string' && value.trim()) return value.trim();
          if (value && typeof value === 'object' && typeof value.message === 'string' && value.message.trim()) {
            return value.message.trim();
          }
          try {
            var nextValue = String(value || '').trim();
            return nextValue || 'Unknown landing bootstrap failure';
          } catch (error) {
            return 'Unknown landing bootstrap failure';
          }
        };

        var failLanding = function (message) {
          if (interactive || failed) return;
          failed = true;
          cleanupLandingWatchdog();
          setSceneLoading(false);
          setButtonMode('reload');
          setStatus(message || FAILED_STATUS);
        };

        var queueEnterRequest = function () {
          if (interactive) return;
          if (failed) {
            window.location.reload();
            return;
          }
          enterRequested = true;
          setSceneLoading(true);
          setButtonMode('loading');
          setStatus(PENDING_STATUS);
        };

        var themeMode = readStoredValue(THEME_STORAGE_KEY, 'auto');
        var textCaseMode = readStoredValue(TEXT_CASE_STORAGE_KEY, null);
        var legacyTextCaseMode = readStoredValue(LEGACY_LOCATION_CASE_STORAGE_KEY, 'upper');
        var prefersDark = typeof window.matchMedia === 'function'
          && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolvedTheme = themeMode === 'light'
          ? 'light'
          : themeMode === 'dark'
            ? 'dark'
            : (prefersDark ? 'dark' : 'light');
        var resolvedTextCase = textCaseMode === 'lower' || legacyTextCaseMode === 'lower'
          ? 'lower'
          : 'upper';

        root.setAttribute('data-theme', resolvedTheme);
        root.setAttribute('data-text-case', resolvedTextCase);
        root.style.setProperty('color-scheme', resolvedTheme);

        setSceneLoading(false);
        setButtonMode('enter');
        setStatus(DEFAULT_STATUS);

        if (enterButton) {
          enterButton.addEventListener('click', function () {
            queueEnterRequest();
          });
        }

        keyListener = function (event) {
          if (event.key !== 'Enter') return;
          event.preventDefault();
          queueEnterRequest();
        };

        window.addEventListener('keydown', keyListener);

        warningTimeoutId = window.setTimeout(function () {
          if (interactive || failed || enterRequested) return;
          setStatus(WARNING_STATUS);
        }, 6000);

        failureTimeoutId = window.setTimeout(function () {
          failLanding(FAILED_STATUS);
        }, 18000);

        errorListener = function (event) {
          if (interactive || failed) return;
          var errorMessage = normalizeLandingErrorMessage(
            event && typeof event === 'object' && 'error' in event ? (event.error || event.message) : event
          );
          console.error('Landing bootstrap error before React became interactive.', errorMessage, event);
          failLanding(FAILED_STATUS);
        };

        rejectionListener = function (event) {
          if (interactive || failed) return;
          var reason = event && typeof event === 'object' && 'reason' in event ? event.reason : event;
          var errorMessage = normalizeLandingErrorMessage(reason);
          console.error('Landing bootstrap unhandled rejection before React became interactive.', errorMessage, reason);
          failLanding(FAILED_STATUS);
        };

        window.addEventListener('error', errorListener);
        window.addEventListener('unhandledrejection', rejectionListener);

        window.__TERMINAL_OS_LANDING__ = {
          consumeEnterRequest: function () {
            var nextRequest = enterRequested;
            enterRequested = false;
            return nextRequest;
          },
          markInteractive: function () {
            if (interactive) return;
            interactive = true;
            cleanupLandingWatchdog();
            if (shell) {
              shell.setAttribute('data-state', 'hidden');
              window.setTimeout(function () {
                if (shell.parentNode) {
                  shell.parentNode.removeChild(shell);
                }
              }, reduceMotion ? 0 : 220);
            }
          }
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
