<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile zoom policy (Option B):
      - disable page-level pinch zoom so shell framing remains stable.
      - allow pinch scaling only inside active panel content.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>TERMINAL-OS</title>
    <style>
      :root {
        --boot-bg: #000000;
        --boot-surface: rgba(0, 17, 0, 0.94);
        --boot-text: #00ff66;
        --boot-text-muted: #66ffcc;
        --boot-border: #00ff66;
        --boot-shadow: 0 0 0 1px rgba(0, 255, 102, 0.18) inset;
      }

      :root[data-theme='light'] {
        --boot-bg: #f5f4ef;
        --boot-surface: rgba(255, 255, 255, 0.96);
        --boot-text: #101010;
        --boot-text-muted: #3f3f3f;
        --boot-border: #101010;
        --boot-shadow: 0 0 0 1px rgba(16, 16, 16, 0.12) inset;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--boot-bg);
      }

      body {
        position: relative;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 50% 22%, rgba(0, 255, 102, 0.12), transparent 34%),
          var(--boot-bg);
        color: var(--boot-text);
        font-family: 'IBM Plex Mono', 'Iosevka Term', 'Courier New', monospace;
        letter-spacing: 0.08em;
        pointer-events: none;
        transition: opacity 280ms ease, visibility 280ms ease;
      }

      #boot-shell[data-state='failed'] {
        pointer-events: auto;
      }

      #boot-shell[data-state='complete'] {
        opacity: 0;
        visibility: hidden;
      }

      #boot-shell::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to right, rgba(0, 255, 102, 0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 255, 102, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
        opacity: 0.18;
      }

      #boot-shell-frame {
        position: relative;
        width: min(560px, 100%);
        display: grid;
        gap: 14px;
        border: 2px solid var(--boot-border);
        background: var(--boot-surface);
        box-shadow: var(--boot-shadow);
        padding: 16px;
        box-sizing: border-box;
      }

      #boot-shell-title {
        border-bottom: 1px solid var(--boot-border);
        padding-bottom: 6px;
        font-size: 12px;
      }

      #boot-shell-copy {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 11px;
        color: var(--boot-text-muted);
      }

      #boot-shell-label {
        color: var(--boot-text);
      }

      #boot-shell-percent {
        flex: 0 0 auto;
      }

      #boot-shell-meter {
        position: relative;
        height: 12px;
        overflow: hidden;
        border: 1px solid var(--boot-border);
        background: rgba(0, 0, 0, 0.28);
      }

      #boot-shell-status {
        min-height: 1.2em;
        margin: 0;
        font-size: 10px;
        color: var(--boot-text-muted);
      }

      #boot-shell-actions {
        display: none;
        justify-content: flex-end;
      }

      #boot-shell[data-state='failed'] #boot-shell-actions {
        display: flex;
      }

      #boot-shell-reload {
        border: 1px solid var(--boot-border);
        background: transparent;
        color: var(--boot-text);
        padding: 8px 14px;
        font: inherit;
        letter-spacing: inherit;
        cursor: pointer;
      }

      #boot-shell-reload:focus-visible {
        outline: 2px solid var(--boot-border);
        outline-offset: 2px;
      }

      #boot-shell-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 100%;
        transform: scaleX(0.12);
        transform-origin: left center;
        background: linear-gradient(90deg, rgba(0, 255, 102, 0.18), var(--boot-text), rgba(0, 255, 102, 0.3));
      }

      #boot-shell-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          90deg,
          transparent 0 12px,
          rgba(255, 255, 255, 0.18) 12px 24px
        );
        animation: boot-shell-stride 1.1s linear infinite;
        mix-blend-mode: screen;
      }

      @keyframes boot-shell-stride {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(24px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-shell {
          transition: none;
        }

        #boot-shell-fill::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-shell" data-state="active">
      <div id="boot-shell-frame" role="status" aria-live="polite" aria-atomic="true">
        <div id="boot-shell-title">[BOOT]</div>
        <div id="boot-shell-copy">
          <span id="boot-shell-label">BOOTSTRAP READY</span>
          <span id="boot-shell-percent">012%</span>
        </div>
        <div id="boot-shell-meter" aria-hidden="true">
          <span id="boot-shell-fill"></span>
        </div>
        <p id="boot-shell-status"></p>
        <div id="boot-shell-actions">
          <button id="boot-shell-reload" type="button">RELOAD</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var THEME_STORAGE_KEY = 'terminalOS.ui.v1.theme';
        var TEXT_CASE_STORAGE_KEY = 'terminalOS.ui.v1.textCase';
        var LEGACY_LOCATION_CASE_STORAGE_KEY = 'terminalOS.ui.v1.locationCase';
        var shell = document.getElementById('boot-shell');
        var fill = document.getElementById('boot-shell-fill');
        var labelNode = document.getElementById('boot-shell-label');
        var percentNode = document.getElementById('boot-shell-percent');
        var statusNode = document.getElementById('boot-shell-status');
        var reloadButton = document.getElementById('boot-shell-reload');
        var root = document.documentElement;
        var reduceMotion = typeof window.matchMedia === 'function'
          && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var floorProgress = 0;
        var displayProgress = 0;
        var currentLabel = 'BOOTSTRAP READY';
        var currentStatus = '';
        var bootState = 'active';
        var completed = false;
        var rafId = 0;
        var lastTickAt = 0;
        var warningTimeoutId = 0;
        var failureTimeoutId = 0;
        var errorListener = null;
        var rejectionListener = null;

        var readStoredValue = function (key, fallbackValue) {
          try {
            var raw = window.localStorage.getItem(key);
            if (raw == null) return fallbackValue;
            return JSON.parse(raw);
          } catch (error) {
            return fallbackValue;
          }
        };

        var themeMode = readStoredValue(THEME_STORAGE_KEY, 'auto');
        var textCaseMode = readStoredValue(TEXT_CASE_STORAGE_KEY, null);
        var legacyTextCaseMode = readStoredValue(LEGACY_LOCATION_CASE_STORAGE_KEY, 'upper');
        var prefersDark = typeof window.matchMedia === 'function'
          && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolvedTheme = themeMode === 'light'
          ? 'light'
          : themeMode === 'dark'
            ? 'dark'
            : (prefersDark ? 'dark' : 'light');
        var resolvedTextCase = textCaseMode === 'lower' || legacyTextCaseMode === 'lower'
          ? 'lower'
          : 'upper';

        root.setAttribute('data-theme', resolvedTheme);
        root.setAttribute('data-text-case', resolvedTextCase);
        root.style.setProperty('color-scheme', resolvedTheme);

        var clampProgress = function (value) {
          if (!Number.isFinite(value)) return floorProgress;
          return Math.max(0, Math.min(100, value));
        };

        var resolveStageCeiling = function (progress) {
          if (progress >= 100) return 100;
          if (progress >= 68) return 92;
          if (progress >= 32) return 58;
          if (progress >= 12) return 28;
          return 12;
        };

        var normalizeBootErrorMessage = function (value) {
          if (typeof value === 'string' && value.trim()) return value.trim();
          if (value && typeof value === 'object' && typeof value.message === 'string' && value.message.trim()) {
            return value.message.trim();
          }
          try {
            var nextValue = String(value || '').trim();
            return nextValue || 'Unknown boot failure';
          } catch (error) {
            return 'Unknown boot failure';
          }
        };

        var setBootState = function (state, message) {
          bootState = state;
          currentStatus = message || '';
          if (shell) {
            shell.setAttribute('data-state', state);
            if (state === 'complete') {
              shell.setAttribute('aria-hidden', 'true');
            } else {
              shell.removeAttribute('aria-hidden');
            }
          }
          if (statusNode) {
            statusNode.textContent = currentStatus;
          }
        };

        var cleanupBootWatchdog = function () {
          if (warningTimeoutId) {
            window.clearTimeout(warningTimeoutId);
            warningTimeoutId = 0;
          }
          if (failureTimeoutId) {
            window.clearTimeout(failureTimeoutId);
            failureTimeoutId = 0;
          }
          if (errorListener) {
            window.removeEventListener('error', errorListener);
            errorListener = null;
          }
          if (rejectionListener) {
            window.removeEventListener('unhandledrejection', rejectionListener);
            rejectionListener = null;
          }
        };

        var failBoot = function (message) {
          if (completed) return;
          cleanupBootWatchdog();
          if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = 0;
          }
          setBootState('failed', message || 'load stalled. reload to retry.');
        };

        var render = function () {
          if (fill) {
            fill.style.transform = 'scaleX(' + (displayProgress / 100) + ')';
          }
          if (labelNode) {
            labelNode.textContent = currentLabel;
          }
          if (percentNode) {
            percentNode.textContent = String(Math.round(displayProgress)).padStart(3, '0') + '%';
          }
        };

        var requestTick = function () {
          if (completed || bootState === 'failed' || rafId) return;
          rafId = window.requestAnimationFrame(tick);
        };

        var tick = function (now) {
          rafId = 0;
          if (completed) return;

          var ceiling = resolveStageCeiling(floorProgress);
          if (displayProgress < floorProgress) {
            displayProgress = floorProgress;
          }

          if (displayProgress < ceiling) {
            var delta = lastTickAt > 0 ? Math.max(16, now - lastTickAt) : 16;
            var gap = ceiling - displayProgress;
            var step = reduceMotion
              ? Math.max(0.15, gap * 0.045)
              : Math.max(0.28, gap * 0.055 + delta * 0.01);

            displayProgress = Math.min(ceiling, Math.max(floorProgress, displayProgress + step));
            render();
            requestTick();
          }

          lastTickAt = now;
        };

        if (reloadButton) {
          reloadButton.addEventListener('click', function () {
            window.location.reload();
          });
        }

        warningTimeoutId = window.setTimeout(function () {
          if (completed || bootState === 'failed') return;
          setBootState('warning', 'still loading...');
        }, 6000);

        failureTimeoutId = window.setTimeout(function () {
          failBoot('load stalled. reload to retry.');
        }, 18000);

        errorListener = function (event) {
          if (completed) return;
          var errorMessage = normalizeBootErrorMessage(
            event && typeof event === 'object' && 'error' in event ? (event.error || event.message) : event
          );
          console.error('Boot shell error before app became interactive.', errorMessage, event);
          failBoot('load stalled. reload to retry.');
        };

        rejectionListener = function (event) {
          if (completed) return;
          var reason = event && typeof event === 'object' && 'reason' in event ? event.reason : event;
          var errorMessage = normalizeBootErrorMessage(reason);
          console.error('Boot shell unhandled rejection before app became interactive.', errorMessage, reason);
          failBoot('load stalled. reload to retry.');
        };

        window.addEventListener('error', errorListener);
        window.addEventListener('unhandledrejection', rejectionListener);

        window.__TERMINAL_OS_BOOT__ = {
          setProgress: function (progress, label) {
            if (completed) return;
            floorProgress = Math.max(floorProgress, clampProgress(progress));
            currentLabel = label || currentLabel;
            if (displayProgress < floorProgress) {
              displayProgress = floorProgress;
            }
            render();
            if (floorProgress < 100) {
              requestTick();
            }
          },
          complete: function () {
            if (completed) return;
            completed = true;
            cleanupBootWatchdog();
            if (rafId) {
              window.cancelAnimationFrame(rafId);
              rafId = 0;
            }
            floorProgress = 100;
            displayProgress = 100;
            currentLabel = 'LANDING INTERACTIVE';
            render();
            if (shell) {
              setBootState('complete', '');
              window.setTimeout(function () {
                if (shell.parentNode) {
                  shell.parentNode.removeChild(shell);
                }
              }, 420);
            }
          }
        };

        setBootState('active', '');
        window.__TERMINAL_OS_BOOT__.setProgress(12, 'BOOTSTRAP READY');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
